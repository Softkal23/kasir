name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

env:
  APP_URL: https://warkop48.freedev.app
  APP_ID: com.warkop48.app
  APP_NAME: Warkop48

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Tulis capacitor.config.json sesuai domain
        run: |
          cat > capacitor.config.json <<JSON
          {
            "appId": "$APP_ID",
            "appName": "$APP_NAME",
            "webDir": "www",
            "server": {
              "url": "$APP_URL",
              "cleartext": false,
              "allowNavigation": ["warkop48.freedev.app"]
            }
          }
          JSON
          cat capacitor.config.json

      - name: Install dependency
        run: npm install

      - name: Pilih versi Java sesuai versi Capacitor
        id: jv
        run: |
          v=$(node -p "require('@capacitor/core/package.json').version.split('.')[0]")
          if [ "$v" -ge 7 ]; then echo "java=21" >> $GITHUB_OUTPUT; else echo "java=17" >> $GITHUB_OUTPUT; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.jv.outputs.java }}

      - name: Buat proyek Android
        run: |
          [ -d android ] || npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Siapkan file APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Warkop48.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Warkop48-apk
          path: Warkop48.apk

      - name: Terbitkan ke Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" Warkop48.apk \
            --title "Warkop48 APK #${{ github.run_number }}" \
            --notes "APK debug Warkop48 (${{ env.APP_URL }})"
