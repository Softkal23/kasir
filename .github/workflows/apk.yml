name: Build APK Kasir
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: warkop48-kasir-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Salin APK dengan nama tetap
        run: cp android/app/build/outputs/apk/debug/app-debug.apk warkop48-kasir.apk
      - name: Terbitkan sebagai Release (tautan unduh)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Warkop48 Kasir (build ${{ github.run_number }})
          files: warkop48-kasir.apk
          make_latest: true
