name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cek alamat situs di capacitor.config.json
        run: |
          if grep -q "GANTI-DOMAINMU" capacitor.config.json; then
            echo "::error::Ganti https://GANTI-DOMAINMU.com di capacitor.config.json dengan alamat situs WarkopKu kamu"; exit 1
          fi

      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Install dependency
        run: npm install

      - name: Pilih versi Java sesuai versi Capacitor
        id: jv
        run: |
          v=$(node -p "require('@capacitor/core/package.json').version.split('.')[0]")
          if [ "$v" -ge 7 ]; then echo "java=21" >> $GITHUB_OUTPUT; else echo "java=17" >> $GITHUB_OUTPUT; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.jv.outputs.java }}

      - name: Buat proyek Android
        run: |
          [ -d android ] || npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: WarkopKu-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
