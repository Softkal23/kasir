name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

env:
  APP_URL: https://warkop48.freedev.app/#/admin
  APP_ID: com.warkop48.admin
  APP_NAME: Warkop48 Admin

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Tulis konfigurasi Capacitor dan halaman awal
        run: |
          mkdir -p www
          cat > www/index.html <<HTML
          <!doctype html>
          <html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>$APP_NAME</title>
          <style>body{background:#260212;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}</style>
          </head><body>Memuat...<script>location.replace("$APP_URL");</script></body></html>
          HTML
          cat > capacitor.config.json <<JSON
          {
            "appId": "$APP_ID",
            "appName": "$APP_NAME",
            "webDir": "www",
            "appendUserAgent": "Warkop48App",
            "server": { "cleartext": false, "allowNavigation": ["warkop48.freedev.app"], "errorPath": "offline.html" }
          }
          JSON
          cat capacitor.config.json
          cat www/index.html

      - name: Install dependency
        run: npm install

      - name: Pilih versi Java sesuai versi Capacitor
        id: jv
        run: |
          v=$(node -p "require('@capacitor/core/package.json').version.split('.')[0]")
          if [ "$v" -ge 7 ]; then echo "java=21" >> $GITHUB_OUTPUT; else echo "java=17" >> $GITHUB_OUTPUT; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.jv.outputs.java }}

      - name: Buat proyek Android
        run: |
          [ -d android ] || npx cap add android
          npx cap sync android

      - name: Terapkan ikon, layar menyala, dan unduhan
        run: |
          set -e
          MA=$(find android/app/src/main/java -name MainActivity.java | head -n1)
          echo "MainActivity: $MA"
          cp patch/MainActivity.java "$MA"
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            for f in ic_launcher ic_launcher_round ic_launcher_foreground; do
              cp resources/mipmap-$d/$f.png android/app/src/main/res/mipmap-$d/$f.png
            done
          done
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#FFFFFF</color>\n</resources>\n' > android/app/src/main/res/values/ic_launcher_background.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />\n    <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n    <uses-feature android:name="android.hardware.bluetooth" android:required="false" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          tail -5 android/app/src/main/AndroidManifest.xml

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Siapkan file APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Warkop48-Admin.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Warkop48-Admin-apk
          path: Warkop48-Admin.apk

      - name: Terbitkan ke Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "admin-${{ github.run_number }}" Warkop48-Admin.apk \
            --title "Warkop48 Admin APK #${{ github.run_number }}" \
            --notes "APK debug Warkop48 Admin (${{ env.APP_URL }})"
